name: Check Gemini Model Drift

# Diff of MODEL_CHAIN against Google's ListModels API.
# Job failure auto-emails the repo owner via GitHub's default notification
# settings, so any drift surfaces without extra plumbing.

on:
  # Dispatched weekly by the daily digest on Mondays (digest.yml's
  # dispatch-model-check job), NOT by GitHub's `schedule:` cron. Two reasons:
  #   1. This is a public repo, and GitHub auto-disables *scheduled* workflows after
  #      60 days of repo inactivity, which would silently kill the drift check
  #      exactly when a quiet repo most needs it. It warned this one would be
  #      disabled on ~2026-07-31.
  #   2. The cron was firing 2-3.5 hours late every week (12:47 UTC scheduled;
  #      15:30, 14:57, 15:34, 16:05 and 16:27 observed).
  # Riding the digest's already-proven external trigger adds no new timer that can
  # fail silently. Keep `workflow_dispatch` - it is now the only trigger. See D-036.
  #
  # Prefer GitHub's built-in cron (simplest, but auto-disables on inactivity)? Uncomment:
  # schedule:
  #   - cron: '47 12 * * 1'   # Mon 12:47 UTC (~8:47 AM ET); ':47' dodges the cron rush
  workflow_dispatch:

jobs:
  check-models:
    # Shares the AUTOMATION_RUNNER switch with the daily digest so all scheduled
    # automation runs in one place (GitHub-hosted by default). See docs/RUNNER.md.
    runs-on: ${{ vars.AUTOMATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # setup-python everywhere except a self-hosted macOS runner (its installer needs
      # passwordless sudo); macOS self-hosted builds a venv from the runner's Python.
      # See digest.yml / docs/RUNNER.md (D-033).
      - name: Set up Python 3.12
        if: ${{ !(vars.AUTOMATION_RUNNER != '' && runner.os == 'macOS') }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Python 3.12 via venv (self-hosted macOS)
        if: ${{ vars.AUTOMATION_RUNNER != '' && runner.os == 'macOS' }}
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -e .

      - name: Run drift check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: research-digest check-models --verbose
